<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>צ'אט משפחתי</title>
<style>
  :root {
    --bar: #075e54; --bg: #ece5dd; --me: #dcf8c6; --them: #ffffff;
    --text: #111; --muted: #667781; --input: #fff; --accent: #25d366;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bar: #1f2c34; --bg: #0b141a; --me: #005c4b; --them: #202c33;
            --text: #e9edef; --muted: #8696a0; --input: #2a3942; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
         background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--bar); color: #fff; padding: 10px 16px;
           padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; }
  header .avatar { width: 40px; height: 40px; border-radius: 50%; background: #128c7e;
                   display: grid; place-items: center; font-size: 22px; }
  header h1 { font-size: 17px; margin: 0; }
  header small { opacity: .8; font-size: 12px; display: block; }
  #status { margin-inline-start: auto; width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; }
  #status.on { background: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
  .msg { max-width: 80%; padding: 6px 9px 4px; border-radius: 8px; background: var(--them);
         align-self: flex-end; box-shadow: 0 1px 1px rgba(0,0,0,.13); word-wrap: break-word; white-space: pre-wrap; }
  .msg.me { background: var(--me); align-self: flex-start; }
  .msg .who { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .msg .time { font-size: 11px; color: var(--muted); text-align: left; margin-top: 2px; }
  .msg img { max-width: 100%; border-radius: 6px; display: block; margin: 2px 0; }
  .day { align-self: center; background: var(--them); color: var(--muted); font-size: 12px;
         padding: 4px 10px; border-radius: 8px; margin: 8px 0; }
  footer { display: flex; gap: 8px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); align-items: flex-end; }
  #text { flex: 1; border: none; border-radius: 22px; padding: 11px 16px; font-size: 16px; resize: none;
          max-height: 120px; background: var(--input); color: var(--text); font-family: inherit; }
  button.round { width: 46px; height: 46px; border-radius: 50%; border: none; background: #128c7e;
                 color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  #pick { background: transparent; color: var(--muted); font-size: 24px; }
  #login { position: fixed; inset: 0; background: var(--bar); color: #fff; display: flex;
           flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  #login h2 { margin: 0; font-size: 26px; }
  #login input { font-size: 18px; padding: 12px 16px; border-radius: 10px; border: none; width: 100%; max-width: 300px; text-align: center; }
  #login button { font-size: 18px; padding: 12px 32px; border-radius: 24px; border: none; background: var(--accent); color: #fff; font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="login">
    <div style="font-size:64px">👨‍👩‍👧‍👦</div>
    <h2>צ'אט משפחתי</h2>
    <p style="margin:0;opacity:.85">איך קוראים לך?</p>
    <input id="nameInput" maxlength="30" placeholder="למשל: אבא" autocomplete="off">
    <button id="enter">כניסה</button>
  </div>

  <header>
    <div class="avatar">👨‍👩‍👧‍👦</div>
    <div>
      <h1>המשפחה</h1>
      <small id="online">מתחבר…</small>
    </div>
    <div id="status" title="מצב חיבור"></div>
  </header>

  <div id="list"></div>

  <footer>
    <button class="round" id="pick" title="שליחת תמונה">📷</button>
    <input type="file" id="file" accept="image/*" class="hidden">
    <textarea id="text" rows="1" placeholder="הודעה"></textarea>
    <button class="round" id="send" title="שליחה">➤</button>
  </footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let me = store.get('familyChatName');
  let lastId = 0;
  let lastDay = '';
  let es = null;

  function start() {
    $('login').classList.add('hidden');
    connect();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
  if (me) start();
  $('enter').onclick = () => {
    const n = $('nameInput').value.trim();
    if (!n) return;
    me = n; store.set('familyChatName', n); start();
  };
  $('nameInput').onkeydown = e => { if (e.key === 'Enter') $('enter').click(); };

  function fmtTime(ts) { return new Date(ts).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }
  function fmtDay(ts) { return new Date(ts).toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' }); }

  function render(m) {
    if (m.id <= lastId) return;
    lastId = m.id;
    const list = $('list');
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    const day = fmtDay(m.id);
    if (day !== lastDay) {
      lastDay = day;
      const d = document.createElement('div'); d.className = 'day'; d.textContent = day; list.appendChild(d);
    }
    const el = document.createElement('div');
    const mine = m.name === me;
    el.className = 'msg' + (mine ? ' me' : '');
    if (!mine) {
      const w = document.createElement('div'); w.className = 'who'; w.textContent = m.name;
      w.style.color = colorFor(m.name); el.appendChild(w);
    }
    if (m.image) { const img = document.createElement('img'); img.src = m.image; img.onload = () => atBottom && scrollDown(); el.appendChild(img); }
    if (m.text) { const t = document.createElement('div'); t.textContent = m.text; el.appendChild(t); }
    const tm = document.createElement('div'); tm.className = 'time'; tm.textContent = fmtTime(m.id); el.appendChild(tm);
    list.appendChild(el);
    if (atBottom || mine) scrollDown();
    return mine;
  }
  function scrollDown() { const l = $('list'); l.scrollTop = l.scrollHeight; }
  function colorFor(name) {
    let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360;
    return `hsl(${h} 60% 42%)`;
  }

  function connect() {
    if (es) es.close();
    es = new EventSource(`events?name=${encodeURIComponent(me)}&since=${lastId}`);
    es.onopen = () => $('status').classList.add('on');
    es.onerror = () => { $('status').classList.remove('on'); $('online').textContent = 'אין חיבור… מנסה שוב'; };
    es.addEventListener('history', e => { JSON.parse(e.data).forEach(render); scrollDown(); });
    es.addEventListener('message', e => {
      const m = JSON.parse(e.data);
      render(m);
      if (m.name !== me) notify(m);
    });
    es.addEventListener('online', e => {
      const names = JSON.parse(e.data);
      $('online').textContent = names.length ? 'מחוברים: ' + names.join(', ') : 'אין מחוברים';
    });
  }

  function notify(m) {
    if (navigator.vibrate) navigator.vibrate(150);
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(m.name, { body: m.text || '📷 תמונה' }); } catch {}
    }
  }

  async function send(payload) {
    try {
      const r = await fetch('send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: me, ...payload }) });
      if (!r.ok) throw 0;
      return true;
    } catch { alert('ההודעה לא נשלחה - בדקו שאתם מחוברים לרשת'); return false; }
  }

  $('send').onclick = async () => {
    const t = $('text').value;
    if (!t.trim()) return;
    $('text').value = ''; autosize();
    if (!(await send({ text: t }))) $('text').value = t;
    $('text').focus();
  };
  $('text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('send').click(); }
  });
  function autosize() { const t = $('text'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
  $('text').addEventListener('input', autosize);

  $('pick').onclick = () => $('file').click();
  $('file').onchange = async () => {
    const f = $('file').files[0]; $('file').value = '';
    if (!f) return;
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    const max = 1024, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    send({ image: c.toDataURL('image/jpeg', 0.7) });
  };
})();
</script>
</body>
</html>
